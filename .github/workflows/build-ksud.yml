name: Build patched ksud (private mounts)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Clone sidex15 KernelSU-Next fork
        run: |
          git clone --depth 1 -b next-susfs_v1.5.5-v1.5.7 \
            https://github.com/sidex15/KernelSU-Next.git ksun

      - name: Patch mount.rs (privatize ksu mounts at creation)
        #  stealth: mount_ext4 (modules.img loop) 与 mount_tmpfs (/debug_ramdisk KSU tmpfs)
        #  创建后立即 MS_PRIVATE|MS_REC, 不加入共享 peer-group → 不分配组 id →
        #  per-app umount 后 app mountinfo 的 master:N 序列无缺口 (春秋"挂载间隙")
        run: |
          set -euxo pipefail
          python3 - << 'PYEOF'
          p = 'ksun/userspace/ksud_overlayfs/src/mount.rs'
          s = open(p).read()

          helper = '''
          #[cfg(any(target_os = "linux", target_os = "android"))]
          fn privatize(target: &Path) {
              // stealth: keep ksu mounts out of shared peer groups; a freed
              // group id leaves a detectable gap in app mountinfo sequences
              unsafe {
                  if let std::result::Result::Ok(c) =
                      std::ffi::CString::new(target.display().to_string())
                  {
                      libc::mount(
                          std::ptr::null(),
                          c.as_ptr(),
                          std::ptr::null(),
                          (libc::MS_PRIVATE | libc::MS_REC) as _,
                          std::ptr::null(),
                      );
                  }
              }
          }
          '''

          old1 = ('    } else {\n'
                  '        mount(lo, target.as_ref(), "ext4", MountFlags::empty(), "")?;\n'
                  '    }\n'
                  '    Ok(())\n'
                  '}\n')
          new1 = ('    } else {\n'
                  '        mount(lo, target.as_ref(), "ext4", MountFlags::empty(), "")?;\n'
                  '    }\n'
                  '    privatize(target.as_ref());\n'
                  '    Ok(())\n'
                  '}\n' + helper)
          assert s.count(old1) == 1, 'mount_ext4 tail not unique'
          s = s.replace(old1, new1, 1)

          old2 = ('    } else {\n'
                  '        mount(\n'
                  '            KSU_OVERLAY_SOURCE,\n'
                  '            dest.as_ref(),\n'
                  '            "tmpfs",\n'
                  '            MountFlags::empty(),\n'
                  '            "",\n'
                  '        )?;\n'
                  '    }\n'
                  '    Ok(())\n'
                  '}\n')
          new2 = ('    } else {\n'
                  '        mount(\n'
                  '            KSU_OVERLAY_SOURCE,\n'
                  '            dest.as_ref(),\n'
                  '            "tmpfs",\n'
                  '            MountFlags::empty(),\n'
                  '            "",\n'
                  '        )?;\n'
                  '    }\n'
                  '    privatize(dest.as_ref());\n'
                  '    Ok(())\n'
                  '}\n')
          assert s.count(old2) == 1, 'mount_tmpfs tail not unique'
          s = s.replace(old2, new2, 1)
          open(p, 'w').write(s)

          # Kernel-SU/java-properties 仓库已被删除(404), 换 JingMatrix fork
          t = 'ksun/userspace/ksud_overlayfs/Cargo.toml'
          ts = open(t).read()
          ts = ts.replace('https://github.com/Kernel-SU/java-properties.git',
                          'https://github.com/JingMatrix/java-properties.git')
          open(t, 'w').write(ts)
          l = 'ksun/userspace/ksud_overlayfs/Cargo.lock'
          ls = open(l).read()
          old_src = 'source = "git+https://github.com/Kernel-SU/java-properties.git?branch=master#42a4aa941b70ded2dd3be9e9f892471023e70229"'
          assert old_src in ls
          ls = ls.replace(old_src,
                          'source = "git+https://github.com/JingMatrix/java-properties.git?branch=master"')
          open(l, 'w').write(ls)
          PYEOF
          grep -c 'privatize(' ksun/userspace/ksud_overlayfs/src/mount.rs
          grep -n 'JingMatrix' ksun/userspace/ksud_overlayfs/Cargo.toml ksun/userspace/ksud_overlayfs/Cargo.lock

      - name: Patch diag group-id logging (mount.rs + init_event.rs)
        #  诊断: ksud 各挂载点前后 dump /proc/1/mountinfo 的 shared 组 id 集合
        #  到 /data/local/tmp/gid.log, 定位 id 30/31/41 的分配/释放时机
        run: |
          set -euxo pipefail
          python3 - << 'PYEOF'
          import io

          # ---- mount.rs: diag_groups + privatize 前后记录 ----
          p = 'ksun/userspace/ksud_overlayfs/src/mount.rs'
          s = open(p).read()

          diag = '''
          #[cfg(any(target_os = "linux", target_os = "android"))]
          pub fn diag_groups(tag: &str) {
              let up = std::fs::read_to_string("/proc/uptime").unwrap_or_default();
              let up = up.split_whitespace().next().unwrap_or("?").to_string();
              let mut g: Vec<u32> = vec![];
              if let std::result::Result::Ok(mi) = std::fs::read_to_string("/proc/1/mountinfo") {
                  for l in mi.lines() {
                      for t in l.split_whitespace() {
                          if let Some(r) = t.strip_prefix("shared:") {
                              if let std::result::Result::Ok(n) = r.parse::<u32>() {
                                  g.push(n);
                              }
                          }
                      }
                  }
              }
              g.sort_unstable();
              g.dedup();
              if let std::result::Result::Ok(mut f) = std::fs::OpenOptions::new()
                  .create(true)
                  .append(true)
                  .open("/data/local/tmp/gid.log")
              {
                  use std::io::Write;
                  let body: Vec<String> = g.iter().map(|n| n.to_string()).collect();
                  let _ = writeln!(f, "{} [{}] {}", up, tag, body.join(","));
              }
          }
          '''

          old1 = ('    unsafe {\n'
                  '        if let std::result::Result::Ok(c) =\n'
                  '            std::ffi::CString::new(target.display().to_string())\n'
                  '        {\n')
          new1 = ('    diag_groups(&format!("pre-priv {}", target.display()));\n'
                  '    unsafe {\n'
                  '        if let std::result::Result::Ok(c) =\n'
                  '            std::ffi::CString::new(target.display().to_string())\n'
                  '        {\n')
          assert s.count(old1) == 1, 'privatize head not found'
          s = s.replace(old1, new1, 1)

          old2 = ('            );\n'
                  '        }\n'
                  '    }\n'
                  '}\n')
          new2 = ('            );\n'
                  '        }\n'
                  '    }\n'
                  '    diag_groups(&format!("post-priv {}", target.display()));\n'
                  '}\n')
          assert s.count(old2) == 1, 'privatize tail not found'
          s = s.replace(old2, new2, 1)
          s = s + diag
          open(p, 'w').write(s)

          # ---- init_event.rs: 各阶段标记 ----
          q = 'ksun/userspace/ksud_overlayfs/src/init_event.rs'
          t = open(q).read()

          a = '    ksucalls::report_post_fs_data();\n'
          assert t.count(a) == 1
          t = t.replace(a, a + '\n    crate::mount::diag_groups("pfd-entry");\n', 1)

          b = '''    mount::AutoMountExt4::try_new(target_update_img, module_dir, false)
                  .with_context(|| "mount module image failed".to_string())?;'''
          assert t.count(b) == 1
          t = t.replace(b, b + '\n\n    crate::mount::diag_groups("after-modules-img");', 1)

          c = '''    if let Err(e) = mount::mount_tmpfs(utils::get_tmp_path()) {
                  warn!("do temp dir mount failed: {e}");
              }'''
          assert t.count(c) == 1
          t = t.replace(c, c + '\n\n    crate::mount::diag_groups("after-tmpfs");', 1)

          d = '''    if let Err(e) = mount_modules_systemlessly(module_dir) {
                  warn!("do systemless mount failed: {e}");
              }'''
          assert t.count(d) == 1
          t = t.replace(d, d + '\n\n    crate::mount::diag_groups("after-systemless");', 1)

          open(q, 'w').write(t)
          PYEOF
          grep -c 'diag_groups' ksun/userspace/ksud_overlayfs/src/mount.rs ksun/userspace/ksud_overlayfs/src/init_event.rs

      - name: Build susfsd into ksud assets
        run: |
          cd ksun/userspace/susfsd
          $ANDROID_NDK_LATEST_HOME/ndk-build
          ls -la libs/arm64-v8a/
          cp -f libs/arm64-v8a/susfsd ../ksud_overlayfs/bin/aarch64/susfsd

      - name: Setup Rust + cross
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
          RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1 --force

      - name: Build ksud_overlayfs (aarch64-linux-android)
        run: |
          cd ksun
          CROSS_NO_WARNINGS=0 cross build --target aarch64-linux-android --release \
            --manifest-path ./userspace/ksud_overlayfs/Cargo.toml
          ls -la userspace/ksud_overlayfs/target/aarch64-linux-android/release/ksud

      - name: Upload ksud artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksud-private-mounts
          path: ksun/userspace/ksud_overlayfs/target/aarch64-linux-android/release/ksud
